<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.json" />
    <title>AquaShield AI - Disaster Early Warning</title>

    <!-- Leaflet Vector Engine CDN -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      #root {
        display: flex;
        height: 100vh;
        width: 100vw;
      }
      /* Custom Leaflet Dark UI styling */
      .leaflet-popup-content-wrapper {
        background: #1e293b !important;
        color: #f8fafc !important;
        border-radius: 8px !important;
        border: 1px solid #334155;
      }
      .leaflet-popup-tip {
        background: #1e293b !important;
      }
      /* Keyless Dark-Themed OpenStreetMap Tiles */
      .dark-tiles {
        filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg)
          saturate(0.3) brightness(0.7);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((registration) => {
              console.log('AquaShield Service Worker active at scope:', registration.scope);
            })
            .catch((error) => {
              console.warn('Service Worker registration encountered an issue:', error);
            });
        });
      }
    </script>
  </body>
</html>
